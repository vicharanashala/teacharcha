# Refreshes the Find a faculty training page every morning (6:00 am India time).
# It runs scripts/fetch_trainings.py and saves _data/trainings.json only if something changed.
# To run it by hand: GitHub > Actions > Update trainings list > Run workflow.
name: Update trainings list

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch programmes
        run: python scripts/fetch_trainings.py
      - name: Save if changed
        run: |
          if git diff --quiet -- _data/trainings.json; then
            echo "No change today."
          else
            git config user.name "teacharcha-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _data/trainings.json
            git commit -m "Update trainings list ($(date -u +%Y-%m-%d))"
            git push
          fi
