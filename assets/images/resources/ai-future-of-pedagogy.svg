<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t">
  <title id="t">Lalita's report, two paths: AI as a crutch or as a scaffold</title>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1a1a1a; }
    .h { font-size: 20px; font-weight: 600; }
    .l { font-size: 15px; font-weight: 600; }
    .s { font-size: 13.5px; }
    .box { fill: #fff; stroke: #c9c9c4; stroke-width: 1.4; }
    .good { fill: #e8f3f3; stroke: #1f6f74; stroke-width: 1.6; }
    .bad { fill: #fdf1e5; stroke: #b5651d; stroke-width: 1.6; stroke-dasharray: 5 4; }
    .a { stroke: #555; stroke-width: 1.8; fill: none; marker-end: url(#m); }
  </style>
  <defs><marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#555"/></marker></defs>
  <rect width="760" height="330" rx="8" fill="#f9f9f7"/>
  <text class="h" x="380" y="36" text-anchor="middle">Who did the thinking?</text>

  <rect class="box" x="22" y="125" width="112" height="62" rx="7"/>
  <text class="l" x="78" y="152" text-anchor="middle">Lalita's</text>
  <text class="l" x="78" y="172" text-anchor="middle">report</text>
  <path class="a" d="M134 142 C160 142 158 94 184 94"/>
  <path class="a" d="M134 170 C160 170 158 236 184 236"/>

  <text class="l" x="188" y="58" style="fill:#b5651d">Crutch</text>
  <rect class="box" x="188" y="68" width="150" height="56" rx="7"/>
  <text class="s" x="263" y="92" text-anchor="middle">AI writes</text>
  <text class="s" x="263" y="111" text-anchor="middle">the analysis</text>
  <path class="a" d="M338 96 H382"/>
  <rect class="box" x="386" y="68" width="150" height="56" rx="7"/>
  <text class="s" x="461" y="101" text-anchor="middle">Perfect report</text>
  <path class="a" d="M536 96 H580"/>
  <rect class="bad" x="584" y="68" width="152" height="56" rx="7"/>
  <text class="s" x="660" y="92" text-anchor="middle">She can't</text>
  <text class="s" x="660" y="111" text-anchor="middle">explain it</text>

  <text class="l" x="188" y="204" style="fill:#1f6f74">Scaffold</text>
  <rect class="box" x="188" y="214" width="150" height="58" rx="7"/>
  <text class="s" x="263" y="239" text-anchor="middle">AI explains</text>
  <text class="s" x="263" y="258" text-anchor="middle">the manual</text>
  <path class="a" d="M338 243 H382"/>
  <rect class="box" x="386" y="214" width="150" height="58" rx="7"/>
  <text class="s" x="461" y="239" text-anchor="middle">Lalita works out</text>
  <text class="s" x="461" y="258" text-anchor="middle">the analysis</text>
  <path class="a" d="M536 243 H580"/>
  <rect class="good" x="584" y="214" width="152" height="58" rx="7"/>
  <text class="s" x="660" y="239" text-anchor="middle">She can explain</text>
  <text class="s" x="660" y="258" text-anchor="middle">and defend it</text>

  <text class="s" x="380" y="310" text-anchor="middle" style="fill:#5f5f5f">Our own drawing of an idea in Chatfield (2025)</text>
</svg>
