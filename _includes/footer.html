<!-- Visit counter. To switch it on, put the GoatCounter code in _config.yml (goatcounter). -->
{% if site.goatcounter and site.goatcounter != "" %}
  <p class="ta-visits" id="ta-visits" hidden><i class="ph ph-eye" aria-hidden="true"></i> <strong id="ta-visits-count"></strong> page visits so far</p>
  <script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  <script>
    fetch('https://{{ site.goatcounter }}.goatcounter.com/counter/TOTAL.json')
      .then(function (response) { return response.ok ? response.json() : null; })
      .then(function (data) {
        if (!data || !data.count) { return; }
        document.getElementById('ta-visits-count').textContent = data.count;
        document.getElementById('ta-visits').hidden = false;
      })
      .catch(function () {});
  </script>
{% else %}
  <p class="ta-visits"><i class="ph ph-eye" aria-hidden="true"></i> Visit count starts at launch</p>
{% endif %}
